---
grails:
    profile: web
    codegen:
        defaultPackage: flexygames
info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'
spring:
    main:
        banner-mode: "off"
    groovy:
        template:
            check-template-location: false

# Access control is done by the Grails interceptors, so the Shiro filter lets every request through.
security:
    shiro:
        filter:
            loginUrl: /auth/login
            allowAccessByDefault: true

---
grails:
    mime:
        disable:
            accept:
                header:
                    userAgents:
                        - Gecko
                        - WebKit
                        - Presto
                        - Trident
        types:
            all: '*/*'
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded
            html:
              - text/html
              - application/xhtml+xml
            js: text/javascript
            json:
              - application/json
              - text/json
            multipartForm: multipart/form-data
            pdf: application/pdf
            rss: application/rss+xml
            text: text/plain
            hal:
              - application/hal+json
              - application/hal+xml
            xml:
              - text/xml
              - application/xml
    urlmapping:
        cache:
            maxsize: 1000
    controllers:
        defaultScope: singleton
    converters:
        encoding: UTF-8
    views:
        default:
            codec: html
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                expression: none # change html to none because I don't want to update all the messages including HTML
                scriptlets: html
                taglib: none
                staticparts: none

---
hibernate:
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false
dataSource:
    pooled: true
    jmxExport: true
    driverClassName: org.postgresql.Driver
    username: postgres
    password: ''

environments:
    development:
        dataSource:
            dbCreate: update
            url: jdbc:postgresql://localhost:5432/flexygames
            dialect: org.hibernate.dialect.PostgreSQLDialect
            logSql: true
    test:
        dataSource:
            dbCreate: update
            driverClassName: org.h2.Driver
            username: sa
            url: jdbc:h2:mem:testDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
    production:
        dataSource:
            dbCreate: update
            url: jdbc:postgresql://localhost/flexygames
            dialect: org.hibernate.dialect.PostgreSQLDialect
            # HikariCP pool settings
            properties:
                maximumPoolSize: 50
                minimumIdle: 5
                connectionTimeout: 10000
                idleTimeout: 60000
                maxLifetime: 600000
                validationTimeout: 3000
                transactionIsolation: TRANSACTION_READ_COMMITTED
